# AndroidX is required — every dependency in this project is an androidx.* artifact.
android.useAndroidX=true
# Keep each library's resources (R class) namespaced to itself.
android.nonTransitiveRClass=true
# Give the Gradle daemon enough heap for the Compose compiler.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Kotlin compiles in parallel per module.
kotlin.code.style=official
